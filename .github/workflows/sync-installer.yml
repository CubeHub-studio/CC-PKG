name: Sync CC-PKG Installer

on:
  push:
    branches:
      - main
    paths:
      - pkg

permissions:
  contents: write

jobs:
  sync-installer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync installer
        run: cp pkg index.html

      - name: Commit installer if changed
        run: |
          if git diff --quiet -- index.html; then
            echo "Installer is already synchronized."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "chore: sync GitHub Pages installer with pkg"
          git push
